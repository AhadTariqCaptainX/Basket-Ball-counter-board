<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
  </style>
</head>
<body>
  <div class="new-game-wrapper">
    <button class="new-game-btn" onclick="newGame()">New Game</button>
  </div>
  <div class="scoreboard">
    <div class="team">
      <div class="team-name">HOME</div>
      <div class="score-display" id="home-score">18</div>
      <div class="buttons">
        <button onclick="add1()">+1</button>
        <button onclick="add2()">+2</button>
        <button onclick="add3()">+3</button>
      </div>
    </div>
    <div class="team">
      <div class="team-name">Away</div>
      <div class="score-display" id="guest-score">10</div>
      <div class="buttons">
        <button onclick="add1G()">+1</button>
        <button onclick="add2G()">+2</button>
        <button onclick="add3G()">+3</button>
      </div>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
